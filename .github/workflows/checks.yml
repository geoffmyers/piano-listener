# Generated by the development repository's publishing tooling from the
# project's declared checks, which also gate every publish. Edit the checks
# there; a change made only here is overwritten by the next publish.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: site
        run: |
          # Every local file a page refers to exists, and every script parses.
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          let bad = 0;
          const check = (file, label) => {
            const r = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (r.status !== 0) { console.log(`${label} does not parse\n${r.stderr}`); bad++; }
          };
          const files = fs.readdirSync('.', { recursive: true }).filter(f => !f.includes('node_modules'));
          for (const page of files.filter(f => f.endsWith('.html'))) {
            const html = fs.readFileSync(page, 'utf8');
            for (const [, ref] of html.matchAll(/(?:src|href)="([^"#?]+)[^"]*"/g)) {
              if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(ref)) continue;
              const local = ref.replace(/^\//, '') || '.';
              if (!fs.existsSync(local) && !fs.existsSync(`${local}.html`)) { console.log(`${page}: no such file: ${ref}`); bad++; }
            }
            let n = 0;
            for (const [, attrs = '', body] of html.matchAll(/<script(\s[^>]*)?>([\s\S]*?)<\/script>/g)) {
              if (/\bsrc=/.test(attrs) || !body.trim()) continue;
              const file = `/tmp/${page.replace(/\W/g, '_')}-${++n}.${/type="module"/.test(attrs) ? 'mjs' : 'cjs'}`;
              fs.writeFileSync(file, body);
              check(file, `${page}: inline script ${n}`);
            }
          }
          for (const js of files.filter(f => /\.(js|mjs|cjs)$/.test(f))) check(js, js);
          if (bad) process.exit(1);
          console.log('pages, links and scripts OK');
          JS
          # The Worker configuration and its static assets deploy (nothing is uploaded).
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-dry-run
  detection-tests:
    name: detection tests
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: tests
    steps:
      - uses: actions/checkout@v6
      - name: detection tests
        run: |
          npm ci
          npm test
